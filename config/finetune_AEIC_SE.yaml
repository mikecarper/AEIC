training:
  exp_name: "AEIC_SE_ft"
  
  # Common settings shared by S2 and S3
  common:
    save_num: 10
    eval_freq: 100
    max_grad_norm: 0.1
    dataloader_num_workers: 8
    checkpointing_steps: 5000
    
    # Shared loss weights
    lambda_rate: 2.0 # [2, 4, 8, 16, 32]
    lambda_l2: 0.5
    lambda_dists: 1.0
    lambda_clip: 0.05
    lambda_adv: 0.05
  
  # S2 Stage: Dual-side distillation (512x512)
  s2:
    max_train_steps: 30000 # 30000
    train_patch_size: 512
    train_batch_size_total: 32
    train_batch_size_per_gpu: 1       # Default settings on 2x RTX 3090 (24G)
    gradient_accumulation_steps: 16   # Default settings on 2x RTX 3090 (24G)
    
    base:
      lr: 5e-5
      lambda_distill: 0.001
    
    stages:
      - name: "s2_stage_1"
        end_step: 10000
      
      - name: "s2_stage_2"
        end_step: 20000
        lr: 2e-5
      
      - name: "s2_stage_3"
        end_step: 25000
        lr: 2e-5
        lambda_distill: 0.0
      
      - name: "s2_stage_4"
        end_step: 28000
        lr: 1e-5

      - name: "s2_stage_5"
        end_step: 29000
        lr: 5e-6

      - name: "s2_stage_6"
        end_step: 1000000000000
        lr: 1e-6
        lambda_distill: 0.0  # Clean projection layers
  
  # S3 Stage: High resolution finetuning (1024x1024)
  s3:
    max_train_steps: 5000
    train_patch_size: 1024
    train_batch_size_total: 8
    train_batch_size_per_gpu: 1     # Default settings on 2x RTX 3090 (24G)
    gradient_accumulation_steps: 4  # Default settings on 2x RTX 3090 (24G)
    
    base:
      lr: 2e-5
      lambda_distill: 0.0
    
    stages:
      - name: "s3_stage_1"
        end_step: 3000
      
      - name: "s3_stage_2"
        end_step: 4500
        lr: 1e-5
      
      - name: "s3_stage_3"
        end_step: 4800
        lr: 5e-6

      - name: "s3_stage_4"
        end_step: 1000000000000
        lr: 1e-6
